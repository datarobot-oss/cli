version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "⬆️ SEC(Deps): "
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
      spf13-cli-stack:
        patterns:
          - "github.com/spf13/viper"
          - "github.com/spf13/cobra"
          - "github.com/spf13/pflag"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️ CI(Actions): "
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
