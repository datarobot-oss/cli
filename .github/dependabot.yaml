version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "⬆️ SEC(Deps): "
    # viper and cobra both resolve flag handling through pflag, so a bump to
    # one can need a matching bump to the others. Grouping keeps them in one PR.
    groups:
      spf13-cli-stack:
        patterns:
          - "github.com/spf13/viper"
          - "github.com/spf13/cobra"
          - "github.com/spf13/pflag"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️ CI(Actions): "
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
