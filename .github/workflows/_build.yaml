name: Build (Reusable)

# Single cross-compile build path. Merges the former native build matrix
# (.build-matrix.yaml) and the GoReleaser Windows build (.build-windows.yaml):
# GoReleaser cross-compiles every target on one ubuntu runner. The Windows
# binary is uploaded as an artifact for the Windows smoke-test job to consume.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name for the uploaded Windows binary artifact.'
        required: false
        type: string
        default: 'dr-windows'
      ref:
        description: 'Git ref to checkout (for fork PRs). Defaults to the triggering ref.'
        required: false
        type: string
      trusted-actions:
        description: >-
          Run composite actions from trusted upstream main (checked out into
          ci-tooling/) instead of the checked-out ref. Fork smoke tests must
          set this so fork PRs never execute fork-authored action code (#1031).
        required: false
        type: boolean
        default: false

# S5: deny all by default; jobs opt-in to what they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Cross-compile Binaries with GoReleaser
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write   # upload-artifact
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Trusted actions lane (#1031): when trusted-actions is set, the local
      # composite actions come from upstream main checked out into ci-tooling/
      # (a git fetch, not the 2 GiB codeload tarball that remote action refs
      # download) instead of from the fork-controlled checkout. Local `uses:`
      # paths are static, so the setup step has an if-gated twin; keep the
      # pair in sync.
      - name: Checkout trusted CI tooling (upstream main)
        if: ${{ inputs.trusted-actions }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: datarobot-oss/cli
          ref: main
          path: ci-tooling
          persist-credentials: false

      - name: Set up Go and Task
        if: ${{ !inputs.trusted-actions }}
        uses: ./.github/actions/setup

      - name: Set up Go and Task (trusted)
        if: ${{ inputs.trusted-actions }}
        uses: ./ci-tooling/.github/actions/setup

      - name: Cross-compile binaries with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip homebrew --skip archive

      - name: Upload Windows Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/windows_windows_amd64_v1/dr.exe
          retention-days: 1
