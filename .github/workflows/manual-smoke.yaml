name: Manual Smoke Tests (Dispatch)

# Folds the three former on-demand dispatch shims (deps-install,
# install-integration, installation) into one workflow. Pick a suite with the
# `suite` input; `all` runs every suite.
#
# NOTE: renamed in Phase 4 — workflow_dispatch run history and bookmarks for the
# old per-suite workflows do not carry over.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which smoke suite to run.'
        required: true
        type: choice
        options:
          - all
          - deps
          - install-integration
          - installation
          - acceptance
        default: all
      version:
        description: 'installation suite: specific version to install (e.g. v0.2.49), empty installs latest. acceptance suite: git ref to check out and build, empty builds main.'
        required: false
        type: string
        default: ''

# S5: deny all by default; jobs opt-in to what they need.
permissions:
  contents: read

jobs:
  deps:
    if: ${{ inputs.suite == 'deps' || inputs.suite == 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke.yaml
    with:
      job-name: 'Dependency Install Smoke Tests'
      build: true
      test-script: 'DR_BIN=./dist/dr bash smoke_test_scripts/run_deps_install_smoke_test.sh'

  install-integration:
    if: ${{ inputs.suite == 'install-integration' || inputs.suite == 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke.yaml
    with:
      job-name: 'Install Integration Tests'
      build: true
      test-script: 'LOCAL_BINARY=./dist/dr bash smoke_test_scripts/run_install_integration_test.sh'

  installation:
    if: ${{ inputs.suite == 'installation' || inputs.suite == 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_install-tests.yaml
    with:
      version: ${{ inputs.version }}

  # The live workload/artifact acceptance suite, on demand — e.g. to validate
  # a fix before the nightly run, or to exercise a PR's behavior end to end.
  # Deliberately not part of `all`: it is the heaviest suite (~15 min against
  # a live account) and needs DR_API_TOKEN.
  acceptance:
    if: ${{ inputs.suite == 'acceptance' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_workload-acceptance.yaml
    with:
      version: ${{ inputs.version || 'main' }}
    secrets:
      DR_API_TOKEN: ${{ secrets.DR_API_TOKEN }}
