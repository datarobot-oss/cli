name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GoReleaser drives the build, so Task is not needed here.
      - name: Set up Go
        uses: ./.github/actions/setup
        with:
          install-task: 'false'

      - name: Authenticate Docker to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for dockers_v2's multi-arch buildx invocation below — the
      # runner's default builder can't build/push multiple platforms at once.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAPS_SSH_KEY: ${{ secrets.HOMEBREW_TAPS_SSH_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}

      - name: Mark release as pre-release until verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --prerelease

  # Failure notification is a separate job, not a step in the release job: a
  # job's logs only exist once that job has finished. The diagnosis below also
  # cannot use the run-level log archive (gh run view --log-failed) — GitHub
  # serves it only after the whole run completes, and this job is part of that
  # run — so it fetches the concluded release job's logs directly instead.
  notify-release-failure:
    needs: release
    # always() + explicit result check: a bare failure() is unreliable when the
    # needs graph skips jobs (same reasoning as notify-verification-failure).
    if: always() && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The diagnosis fetches the failed jobs' logs via the Actions jobs/logs
    # API, which gates log access behind actions:read. This job-scoped block
    # grants exactly that (and nothing else) for this job.
    permissions:
      actions: read
    steps:
      # Match the goreleaser output against known infrastructure failure
      # signatures so the Slack alert says what broke and who can fix it,
      # instead of sending everyone to read the raw log. Add new signatures
      # here as they are diagnosed in the wild.
      #
      # Signatures seen in real runs (both from the failed v0.8.1 attempts):
      # - "Team is not yet configured for notarization":
      #   https://github.com/datarobot-oss/cli/actions/runs/35128057233
      # - "REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED":
      #   https://github.com/datarobot-oss/cli/actions/runs/35382156489
      # The notarization catch-all has no motivating run; it is a fallback for
      # notarization failures with a signature not listed above. It requires
      # failure-adjacent wording (failed to notarize / fail / error / reject)
      # because successful runs also mention "notariz" — a later publish,
      # Homebrew, or Docker failure in the same log must not be mislabeled as
      # a notarization failure.
      - name: Diagnose failure
        id: diagnose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out the repo, so gh has no git remote to
          # infer the repository from; GH_REPO provides it explicitly.
          GH_REPO: ${{ github.repository }}
          # Optional repo variable: link to the IT ticket portal, included in
          # the Slack message so the responder can file the ticket directly.
          IT_TICKET_URL: ${{ vars.IT_TICKET_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SUMMARY=""
          ACTION=""

          # gh run view --log-failed only serves the run-level log archive,
          # which GitHub holds back until the whole run completes — and this
          # job is part of that run. Per-job logs have no such gate: the
          # release job has already concluded by the time this job starts.
          # List the failed jobs once, then fetch each one's logs. jq is
          # preinstalled on the runner.
          JOBS_URL="repos/{owner}/{repo}/actions/runs/$RUN_ID/jobs?per_page=100"
          JOBS_JSON="$(gh api "$JOBS_URL" 2>/dev/null || echo '{"jobs":[]}')"
          FAILED_JOB_IDS="$(jq -r '.jobs[] | select(.conclusion == "failure") | .id' <<<"$JOBS_JSON")"
          # Names of the failed steps, so the fallback diagnosis can at least
          # say where the job died even when no signature matches.
          FAILED_STEPS="$(jq -r \
            '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | unique | join(", ")' \
            <<<"$JOBS_JSON")"

          LOGS=""
          for job_id in $FAILED_JOB_IDS; do
            LOGS+="$(gh api --allow-escape-sequences "repos/{owner}/{repo}/actions/jobs/$job_id/logs" 2>/dev/null || true)"$'\n'
          done

          if grep -q "REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED" <<<"$LOGS"; then
            SUMMARY="Apple notarization was rejected: a required Apple Developer Program agreement is missing or expired."
            ACTION="The Apple account holder must sign the pending agreement (https://developer.apple.com/account or App Store Connect → Business). Open a ticket with IT to route this, then re-run the failed workflow — no code or tag changes are needed."
          elif grep -q "Team is not yet configured for notarization" <<<"$LOGS"; then
            SUMMARY="Apple notarization was rejected: the team is not yet configured for notarization."
            ACTION="Open a ticket with IT to check the Apple Developer account's notarization entitlement (Apple Developer Programs Support), then re-run the failed workflow."
          elif grep -qiE "failed to notarize|notariz.*(fail|error|reject)" <<<"$LOGS"; then
            SUMMARY="macOS notarization failed; see the goreleaser step output for Apple's response."
            ACTION="Open a ticket with IT to check the Apple signing/notarization credentials, then re-run the failed workflow."
          fi

          if [ -z "$SUMMARY" ]; then
            SUMMARY="The release job failed${FAILED_STEPS:+ at: $FAILED_STEPS}. See the workflow run for the failing step."
            ACTION="Open a ticket with IT and include a link to this run."
          fi

          if [ -n "$IT_TICKET_URL" ]; then
            ACTION="$ACTION IT ticket portal: $IT_TICKET_URL"
          fi

          {
            echo "summary=$SUMMARY"
            echo "action=$ACTION"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release failure diagnosis"
            echo
            echo "**What happened:** $SUMMARY"
            echo
            echo "**What to do:** $ACTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ DR CLI Release Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ DR CLI Release Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n<${{ github.event.repository.html_url }}|${{ github.repository }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*What happened:*\n${{ steps.diagnose.outputs.summary }}\n\n*What to do:*\n${{ steps.diagnose.outputs.action }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }

  verify-installation:
    needs: release
    uses: ./.github/workflows/_install-tests.yaml
    with:
      version: ${{ github.ref_name }}
    # S1: called workflow declares no secrets — omit secrets block.

  pre-release-smoke-test:
    needs: verify-installation
    uses: ./.github/workflows/_pre-release-smoke.yaml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DR_API_TOKEN: ${{ secrets.DR_API_TOKEN }}

  promote-release:
    needs: [verify-installation, pre-release-smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote release if stable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # Check if this is a semantic prerelease (contains -alpha, -beta, -rc, etc.)
          if [[ "$TAG" =~ -[a-zA-Z] ]]; then
            echo "Skipping promotion: $TAG is a semantic pre-release"
            exit 0
          fi

          # For stable releases: delete and recreate without prerelease flag
          echo "Promoting stable release: $TAG"

          # Get release info
          RELEASE_NOTES=$(gh release view "$TAG" --json body -q .body)
          RELEASE_NAME=$(gh release view "$TAG" --json name -q .name)

          # Download all assets
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --dir /tmp/release-assets

          # Delete the prerelease
          gh release delete "$TAG" --yes --cleanup-tag=false

          # Recreate as stable release with same assets
          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES" \
            /tmp/release-assets/*

      - name: Notify Slack on Success
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ New DR CLI Release Published!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ New DR CLI Release Published!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n<${{ github.event.repository.html_url }}|${{ github.repository }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.repository.html_url }}/releases/tag/${{ github.ref_name }}|View Release Notes>"
                  }
                }
              ]
            }

  notify-verification-failure:
    needs: [verify-installation, pre-release-smoke-test]
    # Use always() + explicit result checks so the alert fires when EITHER gate
    # fails. A bare failure() is unreliable here: when verify-installation fails,
    # pre-release-smoke-test is skipped, and the skipped dependency can cause this
    # job to be skipped too — silencing installation-only failures.
    if: always() && (needs.verify-installation.result == 'failure' || needs.pre-release-smoke-test.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack of Installation Failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ DR CLI Release Requires Review",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ DR CLI Release Requires Review"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Release was published but *installation verification or pre-release smoke tests failed*. The release remains marked as a pre-release."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n<${{ github.event.repository.html_url }}|${{ github.repository }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
