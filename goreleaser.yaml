# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: "dr"

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - <<: &build_defaults
      env:
        - CGO_ENABLED=0

      binary: "dr"
      mod_timestamp: "{{ .CommitTimestamp }}"

      ldflags:
        - >
          -X "github.com/datarobot/cli/internal/version.Version={{ .Tag }}"
          -X "github.com/datarobot/cli/internal/version.GitCommit={{ .ShortCommit }}"
          -X "github.com/datarobot/cli/internal/version.BuildDate={{ .CommitDate }}"
          -X "github.com/datarobot/cli/internal/telemetry.AmplitudeAPIKey={{ if index .Env "AMPLITUDE_API_KEY" }}{{ .Env.AMPLITUDE_API_KEY }}{{ end }}"
          -X "github.com/datarobot/cli/internal/telemetry.InstallMethod=release"

      goarch:
        - amd64
        - arm64
        - riscv64

    id: linux
    goos: [linux]

  - <<: *build_defaults
    id: darwin
    goos: [darwin]

  - <<: *build_defaults
    id: windows
    goos: [windows]

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - LICENSE.txt
      - CHANGELOG.md

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  extra_files:
    - glob: ./**/*.rb
  footer: |
    **Full Changelog**: https://github.com/datarobot-oss/cli/compare/{{ .PreviousTag }}...{{ .Tag }}
  prerelease: auto

git:
  tag_sort: -version:creatordate

dockers_v2:
  - ids: [linux]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/datarobot-oss/cli
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "DataRobot command-line interface."
      "org.opencontainers.image.url": "https://github.com/datarobot-oss/cli"
      "org.opencontainers.image.source": "https://github.com/datarobot-oss/cli"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .CommitDate }}"
      "org.opencontainers.image.licenses": "Apache-2.0"

homebrew_casks:
  - name: dr-cli
    # `{{ "{{HOMEBREW_PREFIX}}" }}` is goreleaser's escape for Homebrew's own
    # `{{HOMEBREW_PREFIX}}` token, which shares the Go template delimiters.
    # Do not use `{{bin}}`: Homebrew does not resolve it in a cask context.
    #
    # Steps run in Homebrew's cask sandbox, so every path `dr self completion
    # install|uninstall` touches must be listed in `writable_paths`; otherwise
    # the writes fail silently because `must_succeed: false` hides the error.
    # Keep in sync with cmd/self/completion/{install,uninstall}/cmd.go.
    # `writable_paths` does not glob, so the best-effort `~/.zcompdump*` cache
    # cleanup done by `dr` is intentionally not listed (it ignores that failure).
    hooks:
      post:
        install_steps: |
          on_macos do
            symlink '{{ "{{HOMEBREW_PREFIX}}" }}/bin/dr', '{{ "{{HOMEBREW_PREFIX}}" }}/bin/datarobot', overwrite: true
            run "xattr", args: ["-dr", "com.apple.quarantine", '{{ "{{HOMEBREW_PREFIX}}" }}/bin/datarobot']
            run "xattr", args: ["-dr", "com.apple.quarantine", '{{ "{{HOMEBREW_PREFIX}}" }}/bin/dr']
            run '{{ "{{HOMEBREW_PREFIX}}" }}/bin/dr', args: ["self", "completion", "install", "--yes"], must_succeed: false, writable_paths: ["~/.zshrc", "~/.zsh/completions", "~/.oh-my-zsh/custom/completions", "~/.bashrc", "~/.bash_completions", "~/.config/fish/completions"]
          end
      pre:
        uninstall_steps: |
          on_macos do
            run '{{ "{{HOMEBREW_PREFIX}}" }}/bin/dr', args: ["self", "completion", "uninstall", "--yes"], must_succeed: false, writable_paths: ["~/.zshrc", "~/.zsh/completions", "~/.oh-my-zsh/custom/completions", "~/.bashrc", "~/.bash_completions", "~/.config/fish/completions"]
            if_path_exists '{{ "{{HOMEBREW_PREFIX}}" }}/bin/datarobot' do
              remove '{{ "{{HOMEBREW_PREFIX}}" }}/bin/datarobot'
            end
          end
    binaries: [ dr ]
    url:
      template: "https://github.com/datarobot-oss/cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://www.datarobot.com"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    description: "DataRobot command-line interface."
    skip_upload: "{{ if .Prerelease }}true{{ else }}false{{ end }}"
    repository:
      owner: datarobot-oss
      name: homebrew-taps
      branch: main
      pull_request:
        enabled: true
        draft: false
      git:
        url: 'git@github.com:datarobot-oss/homebrew-taps.git'
        private_key: '{{ .Env.HOMEBREW_TAPS_SSH_KEY }}'

    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [darwin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        # notarization used to take ~45s (as of 2026-04-02) but Apple's
        # notary service stalled past 10 minutes on two consecutive
        # release runs (v0.12.0, 2026-10-06), timing out both. 20m is
        # goreleaser's hard ceiling — Apple rejects auth tokens with
        # longer lifetimes — so this is as slow as a wait can legally be.
        timeout: 20m
