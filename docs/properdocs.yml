site_name: DataRobot CLI Documentation
site_url: https://datarobot-oss.github.io/cli/dev-docs/
site_description: Documentation for the DataRobot CLI tool
repo_url: https://github.com/datarobot-oss/cli
repo_name: datarobot-oss/cli
edit_uri: edit/main/docs/

extra:
  analytics:
    provider: google
    property: G-MTV90FWR73

theme:
  name: material
  # overrides/.icons holds the mark; icon.logo is inlined as SVG, so it inherits
  # the header colour and flips with the palette (a theme.logo <img> would not).
  custom_dir: overrides
  favicon: img/dr-favicon.svg
  icon:
    logo: datarobot/logo
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - same-dir

# Output configuration
site_dir: dev-docs
docs_dir: .

# Navigation structure
nav:
  - Home: index.md
  - User guide:
      - user-guide/README.md
      - Quick reference: user-guide/quick-reference.md
      - Shell completions: user-guide/shell-completions.md
      - Configuration: user-guide/configuration.md
  - Template system:
      - template-system/README.md
      - Structure: template-system/structure.md
      - Interactive configuration: template-system/interactive-config.md
      - Environment variables: template-system/environment-variables.md
  - Commands:
      - commands/README.md
      - auth: commands/auth.md
      - start: commands/start.md
      - run: commands/run.md
      - task: commands/task.md
      - dotenv: commands/dotenv.md
      - completion: commands/completion.md
      - self: commands/self.md
      - plugins: commands/plugins.md
      - component: commands/component-managed-updates.md
      - dependencies: commands/dependencies.md
      - artifact: commands/artifact.md
      - workload: commands/workload.md
      - pipeline: commands/pipeline.md
      - pipeline reference: commands/pipelines-reference.md
      - llm-gateway: commands/llm-gateway.md
  - Development:
      - development/README.md
      - Setup: development/setup.md
      - Devcontainer: development/devcontainer.md
      - Building: development/building.md
      - Structure: development/structure.md
      - Authentication: development/authentication.md
      - Releasing: development/releasing.md
      - Plugins: development/plugins.md
      - Telemetry: development/telemetry.md
      - Configuration & viper: development/configuration.md
      - Flags: development/flags.md
      - Feature gates: development/feature-gates.md
      - Root command factory: development/root-factory.md
      - Tool registry: development/tool-registry.md
      - Remote plugins: development/remote-plugins.md
      - Editing user files: development/editing-user-files.md
      - Workload state validation: development/workload-wapi-validation.md

# Exclude patterns to avoid processing non-documentation files
exclude_docs: |
  dev-preview/
  .venv/
  overrides/
  pyproject.toml
  component-defaults-example.yaml
  install
  winstall
  index.html
